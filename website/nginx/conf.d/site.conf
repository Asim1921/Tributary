# Load balancing. "zone" shares state between workers, "resolve" re-resolves the service name
# through Docker's DNS so every replica of web/api is used and replicas can come and go.
upstream web {
    zone up_web 64k;
    least_conn;
    server web:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream api {
    zone up_api 64k;
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # Container healthcheck. Not logged, not proxied.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Installers are served only through X-Accel-Redirect from the API.
    location ^~ /_files/ {
        internal;
        alias /srv/downloads/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Direct requests for installers or the download folder: 404, whatever the path.
    location ^~ /downloads/ { return 404; }
    location ~* \.(exe|msi|msix|zip|7z|dmg)$ { return 404; }

    # Downloads: never cached, strict limit. The API replies with X-Accel-Redirect.
    location ^~ /api/download/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=download burst=5 nodelay;
        error_page 429 = @too_many_requests;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache off;
        proxy_pass http://api;
    }

    # Release list and stats: 5 s micro-cache, skipped when a cookie is present.
    location ~ ^/api/(releases|stats)(/|$) {
        limit_req zone=api burst=40 nodelay;
        error_page 429 = @too_many_requests;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache apic;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_cookie;
        proxy_no_cache $http_cookie;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Upstream $proxy_host always;
        proxy_pass http://api;
    }

    # Everything else under /api/ (health and so on): never cached.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        error_page 429 = @too_many_requests;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Upstream $proxy_host always;
        proxy_pass http://api;
    }

    # Hashed build assets: cached for a long time, immutable.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache static;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://web;
    }

    # Optimised images from next/image: cached an hour.
    location ^~ /_next/image {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache static;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://web;
    }

    # Video, stills and other media (file names are not hashed, so browsers keep them a week).
    location ^~ /media/ {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache media;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://web;
    }

    # Everything else is a page: 10 s micro-cache, never when a cookie is present.
    location / {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache html;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_cookie;
        proxy_no_cache $http_cookie;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Upstream $proxy_host always;
        proxy_pass http://web;
    }

    location @too_many_requests {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"too_many_requests","message":"Too many requests. Wait a few seconds and try again."}';
    }
}
