worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 64k;
    client_body_buffer_size 16k;

    # Docker's embedded DNS: lets "server web:3000 resolve" follow replicas as they come and go.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # JSON access log (one object per line, to stdout).
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","cache":"$upstream_cache_status"}';
    access_log /dev/stdout json;

    # gzip for text types (images and video are already compressed).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/ld+json application/xml application/rss+xml
               image/svg+xml font/ttf font/otf application/manifest+json;

    # Rate limits per client address. 429 rather than the default 503.
    limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
    limit_req_zone $binary_remote_addr zone=download:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # Caches (one volume, several zones).
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=256m inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/media  levels=1:2 keys_zone=media:10m  max_size=512m inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/html   levels=1:2 keys_zone=html:10m   max_size=64m  inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/apic   levels=1:2 keys_zone=apic:5m    max_size=32m  inactive=10m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
