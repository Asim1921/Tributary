[package]
name = "engine"
description = "Segmented, resumable HTTP downloads with crash-safe progress. Windows only."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
# native-tls uses Windows' own TLS and certificate store, and needs no extra build
# tools. HTTP/2 stays off on purpose: it shares one TCP connection, and the speed
# gain here comes from running several.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json.workspace = true
thiserror = "2"
tokio.workspace = true
tokio-util = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
sha2.workspace = true
tempfile = "3"
testserver = { path = "../testserver" }
